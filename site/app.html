<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Правовая памятка</title>
<link rel="stylesheet" href="css/app.css">

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f0f11">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Памятка">
</head>
<body class="app-body">

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">⚖</span>
    <div class="brand-text">
      <span class="brand-title">ПРАВОВАЯ ПАМЯТКА</span>
      <span class="brand-sub">Кутузовский · Рабочий стол</span>
    </div>
  </div>

  <button class="search-btn" id="global-search" type="button">
    <span class="search-icon">🔍</span>
    <span class="search-btn-text">Поиск по статьям, документам, терминам…</span>
    <span class="search-kbd">Ctrl+K</span>
  </button>

  <div class="topbar-actions">
        <button class="icon-btn" title="Избранное" id="btn-fav">
      <span>Избранное</span><span class="counter" id="fav-count">0</span>
    </button>
    <button class="icon-btn" title="Корзина" id="btn-cart">
      <span>Корзина</span><span class="counter" id="cart-count">0</span>
    </button>
    <div class="profile-badge" id="profile-badge" title="Сменить профиль можно в сайдбаре">
      <span class="profile-dot" id="profile-dot" style="background:#888"></span>
      <span id="profile-label">Профиль</span>
    </div>
  </div>
</header>

<div class="layout">

  <aside class="sidebar">
    <nav class="nav" id="sidebar-nav"></nav>
    <button class="switch-profile" id="switch-profile">
      <span>👤</span><span>Сменить профиль</span>
    </button>
  </aside>

  <main class="main">
  <div class="main-columns">
    <div class="main-col-left">
      <section class="home-section">
        <h2>Часто нужны</h2>
        <div class="cards-mini" id="block-popular"></div>
      </section>

      <section class="home-section">
        <h2>Недавние</h2>
        <div class="cards-mini" id="block-recent"></div>
      </section>
    </div>

    <aside class="main-col-right">
  <section class="home-section">
    <h2>Последние изменения</h2>
    <ul class="changelog-list" id="block-changelog"></ul>
  </section>

  <section class="home-section">
    <h2>Обновления памятки <span class="app-changelog-ver" id="app-changelog-ver"></span></h2>
    <ul class="app-changelog-list" id="block-app-changelog"></ul>
  </section>
</aside>
  </div>
</main>

<!-- Данные -->
